name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: counsel
          POSTGRES_PASSWORD: counsel_ci
          POSTGRES_DB: counsel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U counsel" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COUNSEL_ENV: ci
      COUNSEL_TEST_ADMIN_URL: postgresql://counsel:counsel_ci@localhost:5432/counsel
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy src scripts
      - name: Shared record schemas are exported
        run: uv run python scripts/export_schemas.py && git diff --exit-code contracts/
      - name: Tests (incl. row-level security)
        run: uv run pytest -q
      - name: Evaluation gate
        run: uv run python -m evals.run

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript types match the record schemas
        run: npm run gen:types && git diff --exit-code lib/contracts/
      - run: npm run typecheck
      - run: npm run build
